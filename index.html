<!doctype html>
<html lang="en" data-lang="en">
<head>

</head>
<body>
  <header class="nav">

        <span>Shelf</span>
      </a>
      <nav class="nav-pill" aria-label="Sections">
        <i class="nav-blob" aria-hidden="true"></i>
        <a href="#/" data-nav="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>

  <button class="fab" data-action="add" aria-label="Add a title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
